version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: main
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /tools
    target-branch: main
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    target-branch: main
    schedule:
      interval: weekly
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      router:
        patterns:
          - "@tanstack/react-router"
          - "@tanstack/router-plugin"
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
