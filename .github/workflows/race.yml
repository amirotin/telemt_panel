name: Race

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 3 * * 0'

permissions:
  contents: read

concurrency:
  group: race-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
      # Exercise the actual embedded interface, not the committed placeholder.
      - name: Build frontend
        run: make web
      - name: Full race suite
        run: make test-race
        env:
          CGO_ENABLED: '1'

      - name: Lite race suite (release JSON implementation)
        run: CGO_ENABLED=1 GOEXPERIMENT=nojsonv2 go test -race -tags lite -count=1 ./...
