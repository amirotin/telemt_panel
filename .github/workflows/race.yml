name: Race

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 3 * * 0'

permissions:
  contents: read

concurrency:
  group: race-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      # Exercise the actual embedded interface, not the committed placeholder.
      - name: Build frontend
        run: make web
      - name: Full race suite
        run: make test-race
        env:
          CGO_ENABLED: '1'

      - name: Lite race suite (release JSON implementation)
        run: CGO_ENABLED=1 GOEXPERIMENT=nojsonv2 go test -race -tags lite -count=1 ./...
