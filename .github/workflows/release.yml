name: Release

on:
  push:
    tags:
      - 'v1.*'

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  race:
    uses: ./.github/workflows/race.yml
    permissions:
      contents: read

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Report build runtimes
        run: |
          go version
          node --version
          npm --version

      # A hyphen in the tag (e.g. v1.0.0-beta.1) marks a prerelease, per
      # semver convention — the release is flagged accordingly below.
      - name: Determine version and prerelease flag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          number='(0|[1-9][0-9]*)'
          identifier='[0-9A-Za-z-]+'
          if [[ ! "$tag" =~ ^v1\.$number\.$number(-$identifier(\.$identifier)*)?(\+$identifier(\.$identifier)*)?$ ]]; then
            echo "Expected a v1.MINOR.PATCH tag with optional prerelease/build identifiers" >&2
            exit 1
          fi
          # A hyphen in build metadata does not make a release a prerelease.
          if [[ "${tag%%+*}" == *-* ]]; then
            prerelease="${tag%%+*}"
            IFS='.' read -r -a identifiers <<< "${prerelease#*-}"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^0[0-9]+$ ]]; then
                echo "Numeric prerelease identifiers must not have leading zeros" >&2
                exit 1
              fi
            done
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make release VERSION="$VERSION"

      - name: Verify release assets before publication
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: RELEASE_DIR="$PWD/release" go test -count=1 -run '^TestReleaseContract$' ./internal/update/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [ci, race, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --draft \
            --generate-notes \
            "${flags[@]}" \
            release/*
          # A failed upload leaves a draft, never a publicly visible partial release.
          gh release edit "$GITHUB_REF_NAME" --draft=false
