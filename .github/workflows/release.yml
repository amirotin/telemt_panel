name: Release

on:
  push:
    tags:
      - 'v1.*'

# gh release create needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  race:
    uses: ./.github/workflows/race.yml
    permissions:
      contents: read

  release:
    needs: race
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Report build runtimes
        run: |
          go version
          node --version
          npm --version

      # A hyphen in the tag (e.g. v1.0.0-beta.1) marks a prerelease, per
      # semver convention — the release is flagged accordingly below.
      - name: Determine version and prerelease flag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          number='(0|[1-9][0-9]*)'
          identifier='[0-9A-Za-z-]+'
          if [[ ! "$tag" =~ ^v1\.$number\.$number(-$identifier(\.$identifier)*)?(\+$identifier(\.$identifier)*)?$ ]]; then
            echo "Expected a v1.MINOR.PATCH tag with optional prerelease/build identifiers" >&2
            exit 1
          fi
          # A hyphen in build metadata does not make a release a prerelease.
          if [[ "${tag%%+*}" == *-* ]]; then
            prerelease="${tag%%+*}"
            IFS='.' read -r -a identifiers <<< "${prerelease#*-}"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^0[0-9]+$ ]]; then
                echo "Numeric prerelease identifiers must not have leading zeros" >&2
                exit 1
              fi
            done
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make release VERSION="$VERSION"

      - name: Verify release assets before publication
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: RELEASE_DIR="$PWD/release" go test -count=1 -run '^TestReleaseContract$' ./internal/update/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --draft \
            --generate-notes \
            "${flags[@]}" \
            release/*
          # A failed upload leaves a draft, never a publicly visible partial release.
          gh release edit "$GITHUB_REF_NAME" --draft=false
