name: Container prerelease

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published prerelease tag to package (no latest tag is changed)
        required: true
        type: string
      reuse_existing:
        description: Verify and reuse both published platform images after a partial publication
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Validate release and download verified binaries
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v1\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]] || { echo 'Use an explicit v1 prerelease tag'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '(.prerelease == true) and (.draft == false)' | grep -qx true
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          release_revision="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$release_revision" || { echo 'Checkout does not match the release tag'; exit 1; }
          {
            echo "BINARY_REVISION=$release_revision"
            echo "VERSION=${RELEASE_TAG#v}"
            echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_ENV"
          for arch in amd64 arm64; do
            upstream=x86_64
            if [ "$arch" = arm64 ]; then upstream=aarch64; fi
            archive="telemt-panel-$upstream-linux-gnu.tar.gz"
            mkdir -p ".container-bin/$arch"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --pattern "$archive.sha256" --dir ".container-bin/$arch"
            (cd ".container-bin/$arch" && sha256sum -c "$archive.sha256")
            python3 - "$arch" ".container-bin/$arch/$archive" <<'PY'
          import pathlib, struct, sys, tarfile
          arch, archive = sys.argv[1:]
          with tarfile.open(archive) as tar:
              members = tar.getmembers()
              assert len(members) == 1 and members[0].name == 'telemt-panel' and members[0].isreg()
              data = tar.extractfile(members[0]).read()
          assert data[:6] == b'\x7fELF\x02\x01'
          assert struct.unpack('<H', data[18:20])[0] == {'amd64': 62, 'arm64': 183}[arch]
          pathlib.Path(archive).with_name('telemt-panel').write_bytes(data)
          PY
          done

      - name: Resolve existing platform images
        if: ${{ inputs.reuse_existing }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          repo = os.environ['GITHUB_REPOSITORY'].lower()
          image = os.environ['IMAGE']
          version = os.environ['VERSION']
          revision = os.environ['BINARY_REVISION']
          with urllib.request.urlopen('https://ghcr.io/token?service=ghcr.io&scope=repository:'+repo+':pull', timeout=20) as response:
              token = json.load(response)['token']
          def read(path):
              req = urllib.request.Request('https://ghcr.io/v2/'+repo+'/'+path, headers={
                  'Authorization': 'Bearer '+token,
                  'Accept': 'application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response), response.headers.get('Docker-Content-Digest', '')
          refs = {}
          for arch in ('amd64', 'arm64'):
              manifest, digest = read('manifests/'+version+'-'+arch)
              assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest), 'invalid platform digest'
              config, _ = read('blobs/'+manifest['config']['digest'])
              assert config['os'] == 'linux' and config['architecture'] == arch, 'platform mismatch'
              labels = config['config'].get('Labels', {})
              assert labels.get('org.opencontainers.image.version') == version, 'version mismatch'
              assert labels.get('org.opencontainers.image.revision') == revision, 'source revision mismatch'
              assert labels.get('io.telemt-panel.binary-revision') == revision, 'binary revision mismatch'
              assert config['config'].get('User') == '65532:65532', 'nonroot profile required'
              refs[arch] = image+'@'+digest
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for arch, ref in refs.items():
                  output.write('EXISTING_'+arch.upper()+'_REF='+ref+'\n')
                  print('Verified existing '+arch+': '+ref)
          PY

      - name: Build and test both architectures before publishing
        env:
          REUSE_EXISTING: ${{ inputs.reuse_existing }}
        shell: bash
        run: |
          set -euo pipefail
          TELEMT_PANEL_IMAGE="$IMAGE:$VERSION" docker compose config --quiet
          for arch in amd64 arm64; do
            if [ "$REUSE_EXISTING" = true ]; then
              ref_name="EXISTING_${arch^^}_REF"
              docker pull --platform "linux/$arch" "${!ref_name}"
              docker tag "${!ref_name}" "telemt-panel-container-test:$arch"
            else
              docker buildx build --platform "linux/$arch" --load --provenance=false \
                --build-arg "VERSION=$VERSION" --build-arg "SOURCE_REVISION=$BINARY_REVISION" \
                --build-arg "BINARY_REVISION=$BINARY_REVISION" \
                --tag "telemt-panel-container-test:$arch" .
            fi
            python3 scripts/container-smoke.py --image "telemt-panel-container-test:$arch" --platform "linux/$arch" --version "$VERSION"
          done

      - name: Refuse replacing an existing version tag
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          repo = os.environ['GITHUB_REPOSITORY'].lower()
          with urllib.request.urlopen('https://ghcr.io/token?service=ghcr.io&scope=repository:'+repo+':pull', timeout=20) as response:
              token = json.load(response)['token']
          req = urllib.request.Request('https://ghcr.io/v2/'+repo+'/manifests/'+os.environ['VERSION'], headers={
              'Authorization': 'Bearer '+token,
              'Accept': 'application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json'})
          try:
              with urllib.request.urlopen(req, timeout=20):
                  raise SystemExit('Container version already exists; refusing to replace it')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          PY

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Publish immutable prerelease and platform manifest
        env:
          REUSE_EXISTING: ${{ inputs.reuse_existing }}
        shell: bash
        run: |
          set -euo pipefail
          sources=()
          for arch in amd64 arm64; do
            if [ "$REUSE_EXISTING" = true ]; then
              ref_name="EXISTING_${arch^^}_REF"
              sources+=("${!ref_name}")
            else
              tag="$IMAGE:$VERSION-$arch"
              docker tag "telemt-panel-container-test:$arch" "$tag"
              docker push "$tag"
              sources+=("$tag")
            fi
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw | \
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          echo "Published $IMAGE:$VERSION (latest unchanged)" >> "$GITHUB_STEP_SUMMARY"
