name: Release contract

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: &release-paths
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'api/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths: *release-paths

permissions:
  contents: read

concurrency:
  group: release-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      # All supported architectures/profiles and updater-compatible aliases.
      - name: Build release assets
        run: make release RELEASE_CHECK_SIZE=0
      - name: Verify release assets against the updater
        run: RELEASE_CHECK_SIZE=0 RELEASE_DIR="$PWD/release" RELEASE_VERSION=0.0.0-dev go test -count=1 -run '^TestReleaseContract$' ./internal/update/
      # Temporary advisory gate while binary size is investigated separately.
      # Tagged publication still uses strict make release and contract checks.
      - name: Report binary size budgets
        continue-on-error: true
        run: RELEASE_DIR="$PWD/release" go test -count=1 -v -run '^TestReleaseBinarySizeBudgets$' ./internal/update/
