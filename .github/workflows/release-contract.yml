name: Release contract

on:
  workflow_dispatch:
    inputs:
      native_only:
        description: Run the native installer and independent updater regressions
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths: &release-paths
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'api/**'
      - 'scripts/**'
      - 'install.sh'
      - 'go.mod'
      - 'go.sum'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths: *release-paths

permissions:
  contents: read

concurrency:
  group: release-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build updater fixture and current panel
        run: |
          npm ci --prefix web
          npm run build --prefix web
          go build -ldflags '-X main.version=1.0.0-worker.test' -o "$RUNNER_TEMP/worker-panel" ./cmd/panel
          go test -c -o "$RUNNER_TEMP/worker-native.test" ./internal/update
          test "$("$RUNNER_TEMP/worker-panel" update-worker --protocol)" = 1
      - name: Verify independent update and rollback with real systemd and sudo
        run: |
          sudo env GITHUB_ACTIONS=true TP_NATIVE_TEST=1 \
            RUNNER_ENVIRONMENT=github-hosted \
            "$RUNNER_TEMP/worker-native.test" -test.v -test.timeout=8m -test.run '^TestNativeWorkerLifecycle$'
      - name: Fetch published RC3 for installer migration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fixture_dir="$RUNNER_TEMP/worker-rc3"
          mkdir "$fixture_dir"
          gh release download v1.0.0-rc.3 --repo "$GITHUB_REPOSITORY" \
            --pattern telemt-panel-x86_64-linux-gnu.tar.gz \
            --pattern telemt-panel-x86_64-linux-gnu.tar.gz.sha256 --dir "$fixture_dir"
          (cd "$fixture_dir" && sha256sum --check telemt-panel-x86_64-linux-gnu.tar.gz.sha256)
          tar -xzf "$fixture_dir/telemt-panel-x86_64-linux-gnu.tar.gz" -C "$fixture_dir" telemt-panel
      - name: Verify installer migration to current worker protocol
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted TP_NATIVE_WORKER_DISPOSABLE=1 \
            TP_TEST_BINARY="$RUNNER_TEMP/worker-panel" TP_TEST_RC3_BINARY="$RUNNER_TEMP/worker-rc3/telemt-panel" \
            bash scripts/install-worker-native-test.sh

  native-rc2-upgrade:
    # Keep the published RC2 -> RC3 transition covered with real systemd/sudo.
    # These historical binaries are intentional: a newly built updater cannot
    # reproduce the privileges and config shipped to existing RC2 users.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch and verify published RC2 and RC3 binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for version in rc.2 rc.3; do
            fixture_dir="$RUNNER_TEMP/tp-native-$version"
            mkdir "$fixture_dir"
            gh release download "v1.0.0-$version" --repo "$GITHUB_REPOSITORY" \
              --pattern telemt-panel-x86_64-linux-gnu.tar.gz \
              --pattern telemt-panel-x86_64-linux-gnu.tar.gz.sha256 --dir "$fixture_dir"
            (cd "$fixture_dir" && sha256sum --check telemt-panel-x86_64-linux-gnu.tar.gz.sha256)
            python3 - "$fixture_dir" <<'PY'
          import os, sys, tarfile
          root = sys.argv[1]
          with tarfile.open(root + '/telemt-panel-x86_64-linux-gnu.tar.gz') as archive:
              members = archive.getmembers()
              assert len(members) == 1 and members[0].name == 'telemt-panel' and members[0].isfile()
              with archive.extractfile(members[0]) as source, open(root + '/telemt-panel', 'xb') as target:
                  target.write(source.read())
          os.chmod(root + '/telemt-panel', 0o755)
          PY
          done
      - name: Verify native upgrade, rollback and repair
        run: |
          sudo env GITHUB_ACTIONS=true TP_NATIVE_TEST=1 \
            TP_TEST_BINARY="$RUNNER_TEMP/tp-native-rc.3/telemt-panel" \
            TP_TEST_RC2_BINARY="$RUNNER_TEMP/tp-native-rc.2/telemt-panel" \
            bash scripts/install-native-upgrade-test.sh

  release-contract:
    if: ${{ !inputs.native_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      # All supported architectures/profiles and updater-compatible aliases.
      - name: Build release assets
        run: make release
      - name: Verify release assets against the updater
        run: RELEASE_DIR="$PWD/release" RELEASE_VERSION=0.0.0-dev go test -count=1 -run '^TestReleaseContract$' ./internal/update/
      - name: Report binary size budgets
        run: RELEASE_DIR="$PWD/release" go test -count=1 -v -run '^TestReleaseBinarySizeBudgets$' ./internal/update/
