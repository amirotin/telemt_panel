name: CI

on:
  push:
    branches: [ next ]
  pull_request:
    branches: [ next ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # Frontend first: go:embed (internal/webui) needs a real dist/ to embed
      # anything more than the committed placeholder, and the Go build below
      # should exercise the actual embedded SPA, not the placeholder — the
      # v0 lesson (frontend before backend, always).
      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Typecheck frontend
        working-directory: web
        run: npx tsc --noEmit

      - name: Test frontend
        working-directory: web
        run: npm test

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Lint (gofmt + vet)
        run: make lint

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Cross-compile targets
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./cmd/panel
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build ./cmd/panel

      # -race requires cgo — stated explicitly so a future job-level
      # CGO_ENABLED=0 cleanup cannot silently break this step. The Build
      # steps above keep verifying the pure-Go configuration we ship.
      - name: Test
        run: make test
        env:
          CGO_ENABLED: "1"

  # Playwright e2e (Task 9, R4): chromium only, against the real `make
  # build` panel binary + cmd/telemt-mock — see web/e2e/stack.ts. A
  # separate job (not a step tacked onto `build` above) so its own
  # `make build` + browser install don't slow down the fast unit-test
  # feedback loop above, and so a flaky e2e run's retry/artifact story
  # stays isolated from it. `needs: build` — no point paying for browser
  # download + a Go build on a commit that doesn't even lint/typecheck.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      # Playwright's own browser cache, keyed on the pinned
      # @playwright/test version — avoids re-downloading Chromium on every
      # run. --with-deps also installs the OS-level libraries Chromium
      # needs on a bare Ubuntu runner.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      # e2e/stack.ts expects the panel binary at ./telemt-panel (make
      # build's output) and builds cmd/telemt-mock itself — see that
      # file's own comment.
      - name: Build panel + frontend
        run: make build

      - name: Run e2e
        working-directory: web
        run: npm run e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # Proves the release Makefile target and the self-updater's AssetMatcher
  # actually agree (P1.2 audit finding): builds every arch/variant tarball
  # exactly as a real release would, then verifies the updater can find,
  # checksum, and extract each one.
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      # `make release` depends on the `web` target (npm ci + npm run
      # build), building the frontend once ahead of every per-arch Go
      # build it embeds into.
      - name: Build release assets
        run: make release

      - name: Verify release assets against the updater
        run: RELEASE_DIR=$PWD/release go test -run TestReleaseContract ./internal/update/

  # install.sh is POSIX sh and must keep working under dash, bash and
  # busybox: lint + syntax, then the sourced unit tests, then the
  # user-namespace e2e (skips itself where the runner forbids userns).
  install-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Lint installer
        run: |
          shellcheck -s sh install.sh scripts/install-test.sh scripts/install-e2e.sh
          dash -n install.sh
          bash -n install.sh

      - name: Build panel binary for installer tests
        run: CGO_ENABLED=0 go build -o telemt-panel ./cmd/panel

      - name: Installer unit tests
        run: |
          TP_TEST_BINARY=$PWD/telemt-panel sh scripts/install-test.sh
          TP_TEST_BINARY=$PWD/telemt-panel bash scripts/install-test.sh

      # Ubuntu 24.04 gates unprivileged user namespaces behind AppArmor;
      # lifting it on the runner lets the e2e create its overlays.
      - name: Installer e2e (user namespace)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          TP_TEST_BINARY=$PWD/telemt-panel sh scripts/install-e2e.sh
