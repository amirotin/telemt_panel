name: CI

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'docs/**' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ 'docs/**' ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # Frontend first: go:embed (internal/webui) needs a real dist/ to embed
      # anything more than the committed placeholder, and the Go build below
      # should exercise the actual embedded SPA, not the placeholder — the
      # v0 lesson (frontend before backend, always).
      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Test frontend
        working-directory: web
        run: npm test

      - name: Build frontend
        working-directory: web
        # The build script already runs tsc --noEmit before Vite.
        run: npm run build

      - name: Check generated SDK drift
        working-directory: web
        run: |
          npm run gen
          git diff --exit-code -- src/lib/api/generated

      - name: Review unused frontend entries
        working-directory: web
        run: npx knip --reporter json --no-exit-code > knip-report.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Lint (gofmt + vet)
        run: make lint

      - name: Staticcheck (full and lite, pinned Go 1.27 tools)
        run: sh scripts/check-static.sh

      - name: Review unreachable Go code with test entries
        run: sh scripts/check-static.sh deadcode > deadcode-report.json

      - name: Check reachable Go vulnerabilities
        run: sh scripts/check-static.sh vuln

      - name: Build
        run: CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=0.0.0-dev" -o telemt-panel ./cmd/panel

      - name: Test
        run: make test
        env:
          CGO_ENABLED: "0"

      - name: Test lite profile
        run: CGO_ENABLED=0 GOEXPERIMENT=nojsonv2 go test -tags lite -count=1 ./...

      - name: Share analysis reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: analysis-reports
          path: |
            deadcode-report.json
            web/knip-report.json
          retention-days: 7

      - name: Share tested panel binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-panel
          path: telemt-panel
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Run browsers against the same binary verified above. The stack only
  # builds its small Telemt mock; no second frontend/panel build is needed.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      # Playwright's own browser cache, keyed on the pinned
      # @playwright/test version — avoids re-downloading Chromium on every
      # run. --with-deps also installs the OS-level libraries Chromium
      # needs on a bare Ubuntu runner.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Download tested panel binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-panel

      # Artifact downloads do not preserve executable permissions.
      - name: Make panel executable
        run: chmod 0755 telemt-panel

      - name: Run e2e
        working-directory: web
        run: |
          mkdir -p "$TMPDIR"
          npm run e2e
        env:
          CI: "true"
          TMPDIR: ${{ runner.temp }}/telemt-panel-e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # install.sh is POSIX sh and must keep working under dash, bash and
  # busybox: lint + syntax, then the sourced unit tests, then the
  # user-namespace e2e (skips itself where the runner forbids userns).
  install-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Lint installer
        run: |
          shellcheck -s sh install.sh scripts/install-test.sh scripts/install-e2e.sh scripts/install-entware-test.sh
          dash -n install.sh
          bash -n install.sh

      - name: Build panel binary for installer tests
        run: CGO_ENABLED=0 go build -o telemt-panel ./cmd/panel

      - name: Installer unit tests
        run: |
          TP_TEST_BINARY=$PWD/telemt-panel sh scripts/install-test.sh
          TP_TEST_BINARY=$PWD/telemt-panel bash scripts/install-test.sh

      # Ubuntu 24.04 gates unprivileged user namespaces behind AppArmor;
      # lifting it on the runner lets the e2e create its overlays.
      - name: Installer e2e (user namespace)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          TP_TEST_BINARY=$PWD/telemt-panel sh scripts/install-e2e.sh
