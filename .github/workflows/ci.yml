name: CI

on:
  push:
    branches: [ next ]
  pull_request:
    branches: [ next ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Go format check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Files not formatted with gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Cross-compile targets
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./cmd/panel
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build ./cmd/panel

      - name: Test
        run: go test ./...
