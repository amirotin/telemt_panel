name: CI

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**/*.md', 'docs/**', 'LICENSE' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**/*.md', 'docs/**', 'LICENSE' ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # Frontend first: go:embed (internal/webui) needs a real dist/ to embed
      # anything more than the committed placeholder, and the Go build below
      # should exercise the actual embedded SPA, not the placeholder — the
      # v0 lesson (frontend before backend, always).
      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Test frontend
        working-directory: web
        run: npm test

      - name: Build frontend
        working-directory: web
        # The build script already runs tsc --noEmit before Vite.
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Lint (gofmt + vet)
        run: make lint

      - name: Build
        run: CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=0.0.0-dev" -o telemt-panel ./cmd/panel

      - name: Test
        run: make test
        env:
          CGO_ENABLED: "0"

      - name: Share tested panel binary
        uses: actions/upload-artifact@v4
        with:
          name: tested-panel
          path: telemt-panel
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Run browsers against the same binary verified above. The stack only
  # builds its small Telemt mock; no second frontend/panel build is needed.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      # Playwright's own browser cache, keyed on the pinned
      # @playwright/test version — avoids re-downloading Chromium on every
      # run. --with-deps also installs the OS-level libraries Chromium
      # needs on a bare Ubuntu runner.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Download tested panel binary
        uses: actions/download-artifact@v4
        with:
          name: tested-panel

      # Artifact downloads do not preserve executable permissions.
      - name: Make panel executable
        run: chmod 0755 telemt-panel

      - name: Run e2e
        working-directory: web
        run: npm run e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # install.sh is POSIX sh and must keep working under dash, bash and
  # busybox: lint + syntax, then the sourced unit tests, then the
  # user-namespace e2e (skips itself where the runner forbids userns).
  install-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Lint installer
        run: |
          shellcheck -s sh install.sh scripts/install-test.sh scripts/install-e2e.sh
          dash -n install.sh
          bash -n install.sh

      - name: Build panel binary for installer tests
        run: CGO_ENABLED=0 go build -o telemt-panel ./cmd/panel

      - name: Installer unit tests
        run: |
          TP_TEST_BINARY=$PWD/telemt-panel sh scripts/install-test.sh
          TP_TEST_BINARY=$PWD/telemt-panel bash scripts/install-test.sh

      # Ubuntu 24.04 gates unprivileged user namespaces behind AppArmor;
      # lifting it on the runner lets the e2e create its overlays.
      - name: Installer e2e (user namespace)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          TP_TEST_BINARY=$PWD/telemt-panel sh scripts/install-e2e.sh
