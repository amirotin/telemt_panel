# Telemt Panel 1.x — configuration
# UI settings are persisted separately to data_dir/panel-state.json.
# Explicit access settings update the selected endpoint's listener, URL, prefix and TLS.
# Unknown keys and tables are rejected at startup; check spelling against this example.

listen = "0.0.0.0:8080"

# Base path for running behind a reverse proxy on a sub-path. Injected
# verbatim into the served page, so it's restricted to a plain URL path:
# empty, or starting with "/" (a trailing slash is normalized), built only from
# letters, digits, ".", "_", "~", "-" and "/" — anything else fails to
# load. Proxies must preserve the prefix; unprefixed requests receive 404.
# Example nginx config for base_path = "/panel":
#   location = /panel { return 308 /panel/; }
#   location ^~ /panel/ { proxy_pass http://127.0.0.1:8080; proxy_buffering off; }
# Forward Host, X-Forwarded-For and X-Forwarded-Proto; see docs/CONFIG.md.
# (proxy_buffering off keeps the /api/events SSE stream flowing through nginx.)
# base_path = "/panel"
# public_url is optional with authentication enabled behind a prefix-preserving proxy.
# Without authentication, domain access requires public_url (DNS rebinding protection).
# public_url = "https://panel.example.com"

# Reverse proxies whose X-Forwarded-For / X-Forwarded-Proto headers are
# trusted (CIDRs or single IPs). Empty (default) = headers ignored.
# trusted_proxies = ["127.0.0.1/32", "::1/128"]

# Directory for mandatory panel-state.json and update staging.
# Empty makes authentication/settings process-local; history still follows [store].
data_dir = "/var/lib/telemt-panel"

[tls]
# http: no TLS (also used behind a reverse proxy). acme: built-in Let's Encrypt.
# certificate: serve an existing PEM certificate/key, reload by restarting the panel.
# Selecting acme accepts the Let's Encrypt subscriber agreement.
mode = "http"
# For ACME, set the TOP-LEVEL listen to "0.0.0.0:8443" and uncomment:
# acme_domain = "panel.example.com"
# acme_cache_dir = "/var/lib/telemt-panel/certs"
# Public TCP/80 must reach the panel for HTTP-01, including future renewals.
# Use persistent storage for the cache; it contains private account/certificate keys.
# For certificate mode instead:
# cert_file = "/etc/telemt-panel/fullchain.pem"
# key_file = "/etc/telemt-panel/privkey.pem"

[telemt]
# Telemt API base URL (no trailing slash).
url = "http://127.0.0.1:9091"
# Authorization header value, verbatim ([server.api].auth_header in Telemt).
auth_header = ""
# Deprecated compatibility key from 0.x; does not select an editing method.
# Editing requires the Telemt Config API; direct file editing is not supported.
# config_edit_mode = "api" # api | file

[auth]
# true disables login; false keeps authentication enabled. Restart required.
# Disable only behind an independently protected network/proxy: access is full admin.
# Empty root public_url permits IP/localhost only; a configured URL permits only
# its host and port, not alternate domains/IPs. This prevents DNS rebinding.
# disabled = false
# Password login is the base method; optional passkeys are enabled from the
# UI and live in panel-state.json, not here.
username = "admin"
# Generate with: telemt-panel hash-password
password_hash = "$2a$10$CHANGE_ME"
# Sliding session lifetime (default 720h = 30 days).
# session_ttl = "720h"

[store]
# This selects only the observability-history backend. Panel state is stored
# separately in data_dir/panel-state.json.
# "sqlite" — durable configurable history; recommended for servers.
# "memory" — in-RAM history; intended for flash-sensitive routers.
# Lite builds contain only memory.
driver = "sqlite"
path = "/var/lib/telemt-panel/panel.db"

[geography]
# Connection-map snapshot build budget in seconds (1..120, default 10).
# Increase for slower hosts; reverse-proxy timeouts must allow this plus 5 seconds.
build_timeout_secs = 10

[subpage]
# Separate client-only listener. Configure public reachability before sharing links.
enabled = false
listen = "127.0.0.1:8081"
base_path = "/sub"
public_url = ""
# Generated by the installer; HMAC key for subscription tokens.
# secret = ""

[subpage.tls]
# Independent transport: http | certificate | acme, with the same keys as [tls].
# Behind nginx/Caddy the internal listener can stay HTTP on loopback.
# Direct HTTP exposes the token and proxy credentials to network interception.
mode = "http"

[host]
# Service manager for status, start/stop and restart operations, including updates.
# "auto" (default) probes the host at startup.
# service_manager = "auto" # auto | systemd | openrc | procd | sysvinit | docker | custom | none
# Where live logs are read from. "auto" (default) probes the host at
# startup.
# log_source = "auto" # auto | journald | logread | syslog | docker | file
# Path tailed when log_source = "file".
# log_file = ""
# Service/container names, when service_manager needs one.
# telemt_service = "telemt"
# panel_service = "telemt-panel"
# telemt_container = "telemt"
# panel_container = "telemt-panel"

# Optional custom service control (config-only; restart the panel to apply).
# Defining all four commands selects custom mode when service_manager is auto.
# Each array is an absolute executable path plus literal arguments, NOT shell text.
# No status command is assumed. Keep scripts and their parent directories trusted.
# [host.commands.telemt]
# start = ["/opt/etc/init.d/S99telemt", "start"]
# stop = ["/opt/etc/init.d/S99telemt", "stop"]
# restart = ["/opt/etc/init.d/S99telemt", "restart"]
# [host.commands.panel]
# restart = ["/opt/etc/init.d/S99telemt-panel", "restart"]

[privileges]
# How the panel executes privileged host operations (installing/restoring
# a binary, restarting a service, tailing a journal, rewriting a config
# file). "auto" (default): direct in-process execution when the panel
# runs as root, otherwise a complete non-interactive sudo policy, otherwise
# manual commands. One selected mode is shared by Telemt updates and panel
# self-updates.
# mode = "auto" # auto | sudo | direct | manual
# Root-owned policy, separate from the runtime-writable config directory.
# Entware defaults to /opt/etc/telemt-panel-privileged/policy.json.
# policy_path = "/etc/telemt-panel-privileged/policy.json"

[updates]
# GitHub repos (owner/name) update checks poll for new releases.
# telemt_repo = "telemt/telemt"
# panel_repo = "amirotin/telemt_panel"
# Personal access token for private repos or to avoid rate limiting.
# github_token = ""
# Installed binary paths that updates replace.
# telemt_binary_path = "/bin/telemt"
# panel_binary_path = "/usr/local/bin/telemt-panel"
