# Telemt Panel (next / 1.x) — configuration
# The panel never writes to this file: settings changed from the UI are
# persisted to the store.

listen = "0.0.0.0:8080"

# Base path for running behind a reverse proxy on a sub-path.
# base_path = "/panel"

# Reverse proxies whose X-Forwarded-For / X-Forwarded-Proto headers are
# trusted (CIDRs or single IPs). Empty (default) = headers ignored.
# trusted_proxies = ["127.0.0.1/32", "::1/128"]

# Directory the panel mirrors its own state to (sessions, subpage nonces,
# settings) so it survives a restart with the "memory" store driver. Empty
# string disables the mirror — state stays in RAM only.
data_dir = "/var/lib/telemt-panel"

[telemt]
# Telemt API base URL (no trailing slash).
url = "http://127.0.0.1:9091"
# Authorization header value, verbatim ([server.api].auth_header in Telemt).
auth_header = ""

[auth]
# Password login is the base method; passkeys and TOTP are enabled from the
# UI and live in the store, not here.
username = "admin"
# Generate with: telemt-panel hash-password
password_hash = "$2a$10$CHANGE_ME"
# Sliding session lifetime (default 720h = 30 days).
# session_ttl = "720h"

[store]
# "memory" (default) — in-RAM state, zero disk writes; fits routers.
# "sqlite"           — persistent state + metric history (graphs); fits VPS.
driver = "memory"
# path = "/var/lib/telemt-panel/panel.db"

[subpage]
# Per-user subscription page at /sub/<token> (no login).
enabled = false
# Generated by the installer; HMAC key for subscription tokens.
# secret = ""

[host]
# How the panel controls services (start/stop/restart, update-triggered
# restarts). "auto" (default) probes the host at startup.
# service_manager = "auto" # auto | systemd | openrc | procd | sysvinit | docker | none
# Where live logs are read from. "auto" (default) probes the host at
# startup.
# log_source = "auto" # auto | journald | logread | syslog | docker | file
# Path tailed when log_source = "file".
# log_file = ""
# Service/container names, when service_manager needs one.
# telemt_service = "telemt"
# panel_service = "telemt-panel"
# telemt_container = "telemt"

[updates]
# GitHub repos (owner/name) update checks poll for new releases.
# telemt_repo = "telemt/telemt"
# panel_repo = "amirotin/telemt_panel"
# Personal access token for private repos or to avoid rate limiting.
# github_token = ""
# Installed binary paths that updates replace.
# telemt_binary_path = "/bin/telemt"
# panel_binary_path = "/usr/local/bin/telemt-panel"
