<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Default (dark, the project default) paint before React/theme.ts run
         and take over updating this tag's content on theme change. -->
    <meta name="theme-color" id="theme-color-meta" content="#12171d" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Telemt Panel" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <!-- iOS Safari's "add to home screen" ignores rel="icon"/the manifest's
         SVG entries entirely and needs a real PNG apple-touch-icon (Task 4's
         carried "SVG-only manifest icons" gap) — generated from icon.svg by
         scripts/generate-icons.mjs. -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Telemt Panel</title>
    <script>
      // Applied before first paint to avoid a flash of the wrong theme —
      // src/lib/theme.ts owns this logic at runtime; this is a minimal,
      // dependency-free duplicate of just the "read + apply" half.
      //
      // Dark is the product default (06-ui.md), so ANY stored value other
      // than an explicit "light"/"system" pins data-theme="dark" — leaving
      // the attribute off would hand a first-time visitor on a light OS the
      // light palette, which is exactly the bug the D1 design pass fixed.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("telemt-panel:theme");
        } catch (e) {}
        if (t !== "system") {
          document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
        }

        // Same idea for the UI language (src/i18n/locale.ts owns this at
        // runtime): a stored preference wins, "auto"/absent follows the
        // browser, anything the panel doesn't ship falls back to en. Set
        // before first paint so assistive tech and the browser's own
        // hyphenation never read the first frame in the wrong language.
        var l = null;
        try {
          l = localStorage.getItem("telemt-panel:locale:v1");
        } catch (e) {}
        if (l !== "ru" && l !== "en") {
          var tags = (navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language || ""]);
          l = "en";
          for (var i = 0; i < tags.length; i++) {
            var p = String(tags[i]).toLowerCase().split("-")[0];
            if (p === "ru" || p === "en") {
              l = p;
              break;
            }
          }
        }
        document.documentElement.lang = l;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
