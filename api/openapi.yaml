# Telemt Panel v2 — HTTP contract (source of truth).
# Server stubs: oapi-codegen. TS client + TanStack Query hooks: hey-api/openapi-ts.
# Conventions (differ from v1 — no {ok,data} envelope):
#   - plain HTTP status codes; success bodies are the resource itself
#   - errors: application/json {code, message} with proper status (schema Error)
#   - auth: opaque session id in HttpOnly cookie "panel_session" (see 05-auth.md)
#   - realtime is SSE (/api/events*), documented here as text/event-stream;
#     event payload shapes live in 02-hub-sse.md and the generated topic types
#   - x-status: planned marks a path with no route registered yet in
#     internal/httpapi/server.go (M3 backlog) — audited against the actual
#     route table, not aspirational; absence of the tag means implemented
openapi: 3.1.0
info:
  title: Telemt Panel API
  version: 2.0.0-draft1
  description: >
    Admin API of Telemt Panel v2 plus the unauthenticated subscription page.
    Telemt-shaped payloads follow the upstream source catalog (specs/07-telemt-sdk.md).

servers:
  - url: /
    description: Same origin; base_path is prepended by the SPA runtime when configured.

tags:
  - { name: auth }
  - { name: users }
  - { name: telemt }
  - { name: host }
  - { name: updates }
  - { name: realtime }
  - { name: misc }
  - { name: subpage }

security:
  - session: []

paths:
  # ───────────────────────── auth ─────────────────────────
  /api/auth/login:
    post:
      tags: [auth]
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                totp: { type: string, description: Required when TOTP is enabled }
      responses:
        "204": { description: Logged in; session cookie set }
        "400": { description: bad_request — malformed request body, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401":
          description: invalid_credentials | totp_required
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses: { "204": { description: Session revoked server-side; cookie cleared } }

  /api/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        "200":
          description: Current admin identity and enabled auth options
          content:
            application/json:
              schema:
                type: object
                required: [username, totp_enabled, passkeys]
                properties:
                  username: { type: string }
                  totp_enabled: { type: boolean }
                  passkeys:
                    type: array
                    items: { $ref: "#/components/schemas/PasskeyInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      responses:
        "200":
          description: Active sessions (current one flagged)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SessionInfo" } }
    delete:
      tags: [auth]
      operationId: revokeOtherSessions
      description: Revoke all sessions except the current one.
      responses: { "204": { description: Revoked } }

  /api/auth/sessions/{sessionId}:
    delete:
      tags: [auth]
      operationId: revokeSession
      parameters: [ { name: sessionId, in: path, required: true, schema: { type: string } } ]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }

  # TOTP lifecycle (state lives in store, not config) — not yet implemented,
  # see each path's x-status below.
  /api/auth/totp/setup:
    x-status: planned
    post:
      tags: [auth]
      operationId: totpSetup
      responses:
        "200":
          description: Provisioning secret for QR (not yet enabled)
          content:
            application/json:
              schema:
                type: object
                required: [otpauth_url, secret]
                properties:
                  otpauth_url: { type: string }
                  secret: { type: string }
  /api/auth/totp/enable:
    x-status: planned
    post:
      tags: [auth]
      operationId: totpEnable
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses:
        "200":
          description: Enabled; recovery codes shown exactly once
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/auth/totp:
    x-status: planned
    delete:
      tags: [auth]
      operationId: totpDisable
      responses: { "204": { description: Disabled } }

  # WebAuthn: bodies/responses are the standard CredentialCreation/Request JSON
  # produced by go-webauthn; typed loosely on purpose. Not yet implemented,
  # see each path's x-status below.
  /api/auth/webauthn/register/begin:
    x-status: planned
    post:
      tags: [auth]
      operationId: webauthnRegisterBegin
      responses:
        "200": { description: CredentialCreationOptions, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/auth/webauthn/register/finish:
    x-status: planned
    post:
      tags: [auth]
      operationId: webauthnRegisterFinish
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "200": { description: Registered, content: { application/json: { schema: { $ref: "#/components/schemas/PasskeyInfo" } } } }
  /api/auth/webauthn/login/begin:
    x-status: planned
    post:
      tags: [auth]
      security: []
      operationId: webauthnLoginBegin
      responses:
        "200": { description: CredentialRequestOptions, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { description: No passkeys enrolled }
  /api/auth/webauthn/login/finish:
    x-status: planned
    post:
      tags: [auth]
      security: []
      operationId: webauthnLoginFinish
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "204": { description: Logged in; session cookie set }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/webauthn/credentials/{credentialId}:
    x-status: planned
    delete:
      tags: [auth]
      operationId: webauthnDeleteCredential
      parameters: [ { name: credentialId, in: path, required: true, schema: { type: string } } ]
      responses: { "204": { description: Deleted }, "404": { $ref: "#/components/responses/NotFound" } }

  # ───────────────────────── users ─────────────────────────
  /api/users:
    get:
      tags: [users]
      operationId: listUsers
      description: >
        Composite of Telemt GET /v1/users merged with quota usage (when the
        `quota` capability is present) and the panel's subscription URL.
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/User" } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
    post:
      tags: [users]
      operationId: createUser
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UserCreate" } } }
      responses:
        "201":
          description: Created; secret returned exactly once
          content:
            application/json:
              schema:
                type: object
                required: [user, secret]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  secret: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: user_exists, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/TelemtReadOnly" }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }

  /api/users/{username}:
    parameters: [ { $ref: "#/components/parameters/Username" } ]
    get:
      tags: [users]
      operationId: getUser
      responses:
        "200": { description: User, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
    patch:
      tags: [users]
      operationId: patchUser
      description: >
        JSON Merge Patch semantics forwarded to Telemt: omitted = unchanged,
        null = remove the limit, value = set.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UserPatch" } } }
      responses:
        "200": { description: Updated user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/TelemtReadOnly" }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
    delete:
      tags: [users]
      operationId: deleteUser
      responses:
        "204": { description: Deleted }
        "409": { description: last_user_forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }

  /api/users/{username}/reset-quota:
    post:
      tags: [users]
      operationId: resetUserQuota
      parameters: [ { $ref: "#/components/parameters/Username" } ]
      responses:
        "200":
          description: Usage zeroed
          content:
            application/json:
              schema:
                type: object
                required: [username, used_bytes, last_reset_epoch_secs]
                properties:
                  username: { type: string }
                  used_bytes: { type: integer, const: 0 }
                  last_reset_epoch_secs: { type: integer, format: int64 }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/TelemtReadOnly" }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }

  /api/users/{username}/rotate-secret:
    post:
      tags: [users]
      operationId: rotateUserSecret
      description: Rotates the user's secret; implicitly invalidates the old subscription link.
      parameters: [ { $ref: "#/components/parameters/Username" } ]
      responses:
        "200":
          description: New secret returned exactly once
          content:
            application/json:
              schema:
                type: object
                required: [user, secret]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  secret: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/TelemtReadOnly" }
        "501": { description: capability_absent — not supported on this Telemt build, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }

  /api/users/{username}/enabled:
    put:
      tags: [users]
      operationId: setUserEnabled
      parameters: [ { $ref: "#/components/parameters/Username" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } }
      responses:
        "200": { description: Updated user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/TelemtReadOnly" }
        "501": { description: capability_absent — not supported on this Telemt build, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }

  /api/users/{username}/sublink:
    get:
      tags: [users]
      operationId: getUserSublink
      parameters: [ { $ref: "#/components/parameters/Username" } ]
      responses:
        "200":
          description: Current subscription URL for sharing
          content: { application/json: { schema: { $ref: "#/components/schemas/Sublink" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: sublink_unavailable — user has no classic/secure link to derive one from, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
    post:
      tags: [users]
      operationId: regenerateUserSublink
      description: Rotates the per-user nonce; the previous subscription URL stops working.
      parameters: [ { $ref: "#/components/parameters/Username" } ]
      responses:
        "200": { description: New URL, content: { application/json: { schema: { $ref: "#/components/schemas/Sublink" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: sublink_unavailable — user has no classic/secure link to derive one from, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }

  # ───────────────────────── telemt ─────────────────────────
  /api/telemt/info:
    get:
      tags: [telemt]
      operationId: getTelemtInfo
      responses:
        "200":
          description: Version, connectivity and capability flags (07-telemt-sdk.md §3)
          content: { application/json: { schema: { $ref: "#/components/schemas/TelemtInfo" } } }

  /api/telemt/config:
    get:
      tags: [telemt]
      operationId: getTelemtConfig
      description: >
        Passthrough of Telemt's GET /v1/config: editable sections plus the revision to
        chain into a later PATCH's If-Match. api mode only in this release — file mode
        (telemt.config_edit_mode=file) is not implemented yet.
      responses:
        "200":
          description: Editable sections + revision
          content: { application/json: { schema: { $ref: "#/components/schemas/TelemtConfig" } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
        "503": { description: capability_unavailable — this Telemt build/config does not expose the config API, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      tags: [telemt]
      operationId: patchTelemtConfig
      description: >
        Passthrough of Telemt's PATCH /v1/config. The revision travels as an `If-Match`
        header (required — from a prior GET's `revision`), not a body field. An inline
        reload can be requested via query parameters, forwarded to Telemt's own
        `reload`/`timeout_secs`/`failure_policy` query (07-telemt-sdk.md §Config);
        omitting `reload` patches without reloading.
      parameters:
        - { name: reload, in: query, schema: { type: string, enum: [instant, drain] } }
        - { name: timeout_secs, in: query, schema: { type: integer, minimum: 1 } }
        - { name: failure_policy, in: query, schema: { type: string, enum: [keep_new, rollback] } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TelemtConfigPatch" } } }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: "#/components/schemas/TelemtConfigPatchResult" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: revision_conflict — re-read and merge
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/TelemtReadOnly" }
        "422":
          description: >
            access_not_editable | section_not_editable | field_not_editable |
            config_patch_not_atomic | ambiguous_listeners — the patch itself is not
            applicable, regardless of the HTTP status Telemt used internally.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
        "503": { description: capability_unavailable — this Telemt build/config does not expose the config API, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/telemt/reload:
    post:
      tags: [telemt]
      operationId: reloadTelemt
      description: >
        Passthrough of Telemt's POST /v1/system/reload — config re-read via the reload
        API (capability `reload_api`), not a service restart. `If-Match`, when sent, is
        forwarded as the mutation's revision.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [instant, drain], default: instant }
                timeout_secs: { type: integer, minimum: 1, maximum: 3600 }
                failure_policy: { type: string, enum: [keep_new, rollback], default: keep_new }
      responses:
        "202": { description: Reload accepted, content: { application/json: { schema: { $ref: "#/components/schemas/ReloadAccepted" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/TelemtReadOnly" }
        "409": { description: reload_in_progress, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "501": { description: capability_absent — offer service restart instead, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }

  /api/telemt/reload/{id}:
    get:
      tags: [telemt]
      operationId: getTelemtReloadStatus
      description: Passthrough of Telemt's GET /v1/system/reload/{id} — poll until State reaches a terminal phase.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        "200": { description: Reload status, content: { application/json: { schema: { $ref: "#/components/schemas/ReloadStatus" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: reload_not_found — unknown or aged-out id, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "501": { description: capability_absent, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }

  /api/telemt/restart:
    post:
      tags: [telemt]
      operationId: restartTelemtService
      description: >
        Service-level restart through the host layer (01-host-matrix.md), independent of
        the reload endpoints above — restarts the whole process rather than re-reading
        config. Disabled when host cap restart_telemt=false.
      responses:
        "202": { description: Restart initiated }
        "503": { description: manual_restart_required — automatic restart unavailable on this host; message carries the manual command (same info as /api/host manual_commands), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: internal_error — the restart op itself failed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/telemt/zero:
    get:
      tags: [telemt]
      operationId: getTelemtZero
      description: >
        Passthrough of Telemt's GET /v1/stats/zero/all — the deep counter dump
        (core/upstream/middle_proxy/pool/desync). Display-only: the panel never
        branches on these values, only shows them (web's Диагностика → Счётчики page).
        Fetched on visit, not a hub topic.
      responses:
        "200": { description: Deep counter dump, content: { application/json: { schema: { $ref: "#/components/schemas/ZeroAllData" } } } }
        "501": { description: capability_absent — this Telemt build/config does not expose zero/all, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }

  /api/telemt/tls-fingerprints:
    get:
      tags: [telemt]
      operationId: getTelemtTlsFingerprints
      description: >
        Passthrough of Telemt's GET /v1/runtime/tls-fingerprints — JA3/JA4 aggregates
        grouped by fingerprint, IP, CIDR and user. Deliberately NOT part of the `security`
        SSE topic: the live payload is ~120 KB per call (four lists of 50), so it is
        fetched on visit at the page's own cadence instead of polled for every client.
        Gated behind Telemt's runtime_edge_enabled — a build/config with it off answers
        503 capability_unavailable, which the UI renders as its Gated hint, not an error.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200": { description: Gated TLS fingerprint aggregates, content: { application/json: { schema: { $ref: "#/components/schemas/GatedTlsFingerprints" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "501": { description: capability_absent — this Telemt build predates the runtime edge routes, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
        "503": { description: capability_unavailable — runtime_edge_enabled is off, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/telemt/web/sessions:
    get:
      tags: [telemt]
      operationId: getTelemtWebSessions
      description: >
        Passthrough of Telemt's GET /v1/runtime/web/sessions (Telemt >= 3.5.3): the live
        WEB sessions, filtered and cursor-paged. Fetch-on-visit, not part of the `web` SSE
        topic — the topic carries only the status snapshot. The query parameters below are
        the EXACT whitelist Telemt accepts; any other or repeated name is 400 bad_request.
        A WEB runtime that is not running answers 503 capability_unavailable (a gate the UI
        renders, not an error); a build predating the routes answers 501 capability_absent.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: session_ref, in: query, required: false, schema: { type: string } }
        - { name: ip, in: query, required: false, schema: { type: string } }
        - { name: host, in: query, required: false, schema: { type: string } }
        - { name: user, in: query, required: false, schema: { type: string } }
        - { name: user_agent_id, in: query, required: false, schema: { type: string } }
        - { name: key_id, in: query, required: false, schema: { type: string } }
        - { name: carrier, in: query, required: false, schema: { type: string, enum: [https, https-lanes, websocket, websocket-lanes] } }
        - { name: state, in: query, required: false, schema: { type: string, enum: [provisional, replacing, committed, superseded, healthy, closing, closed] } }
      responses:
        "200": { description: One page of live WEB sessions, content: { application/json: { schema: { $ref: "#/components/schemas/WebSessionPage" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "501": { description: capability_absent — this Telemt build predates the WEB runtime routes, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
        "503": { description: capability_unavailable — the WEB runtime is not running, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/telemt/web/sessions/{ref}:
    get:
      tags: [telemt]
      operationId: getTelemtWebSession
      description: >
        Passthrough of Telemt's GET /v1/runtime/web/sessions/{session_ref}. Both outcomes
        are 200: `row` for a live session, `closed` for a retained tombstone (Telemt answers
        that with HTTP 410 wrapping an ordinary success envelope, which is a result, not a
        failure). A ref with neither answers 404 web_session_not_found.
      parameters:
        - { name: ref, in: path, required: true, schema: { type: string }, description: "Canonical ws1.<instance>.<id> reference" }
      responses:
        "200": { description: The live row or the closed-session tombstone, content: { application/json: { schema: { $ref: "#/components/schemas/WebSessionLookup" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: web_session_not_found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "501": { description: capability_absent — this Telemt build predates the WEB runtime routes, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
        "503": { description: capability_unavailable, or web_snapshot_busy when an exact lookup lost a lock race, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/telemt/web/sessions/close:
    post:
      tags: [telemt]
      operationId: closeTelemtWebSessions
      description: >
        Passthrough of Telemt's POST /v1/runtime/web/sessions/close — the panel's ONE WEB
        mutation. Asynchronous: the 202 carries an `operation_id` to poll through
        /api/telemt/web/operations/{id}. `runtime_instance` is the process fence and comes
        from the `web` topic's status snapshot; a Telemt that has restarted since answers
        409 web_runtime_mismatch. The `all` selector additionally requires WEB issuance to
        be off (409 web_issuance_enabled). Recorded in the audit journal as
        `web.sessions.close`. Telemt's debug/clear and carrier-learning/reset mutations are
        deliberately NOT exposed by the panel.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WebCloseRequest" } } }
      responses:
        "202": { description: Close operation accepted, content: { application/json: { schema: { $ref: "#/components/schemas/WebControlOperationStatus" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: read_only — the Telemt API runs in read-only mode, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: web_runtime_mismatch, web_issuance_enabled or web_operation_in_progress, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { description: payload_too_large — the close body exceeds Telemt's own 64 KiB control-body cap, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "415": { description: "unsupported_media_type — Telemt's control routes require exactly one byte-exact `Content-Type: application/json`. Unreachable through the panel (the SDK sets the header itself) but declared because the code is Telemt's own.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "501": { description: capability_absent — this Telemt build predates the WEB runtime routes, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
        "503": { description: capability_unavailable — the WEB runtime is not running, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/telemt/web/operations/{id}:
    get:
      tags: [telemt]
      operationId: getTelemtWebOperation
      description: >
        Passthrough of Telemt's GET /v1/runtime/web/operations/{operation_id}: the status of
        one close operation. Telemt retains the last 32; an older id answers 404
        web_operation_not_found.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "Canonical wo1.<instance>.<sequence> id" }
      responses:
        "200": { description: Operation status, content: { application/json: { schema: { $ref: "#/components/schemas/WebControlOperationStatus" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: web_operation_not_found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "501": { description: capability_absent — this Telemt build predates the WEB runtime routes, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
        "503": { description: capability_unavailable — the WEB runtime is not running, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ───────────────────────── host ─────────────────────────
  /api/host:
    get:
      tags: [host]
      operationId: getHost
      responses:
        "200":
          description: Detected platform and capabilities (01-host-matrix.md)
          content: { application/json: { schema: { $ref: "#/components/schemas/HostInfo" } } }

  # ───────────────────────── updates ─────────────────────────
  /api/updates:
    get:
      tags: [updates]
      operationId: getUpdates
      responses:
        "200":
          description: Both targets — versions, releases, active run, journal
          content: { application/json: { schema: { $ref: "#/components/schemas/UpdatesStatus" } } }

  /api/updates/{target}/apply:
    post:
      tags: [updates]
      operationId: applyUpdate
      parameters:
        - { name: target, in: path, required: true, schema: { type: string, enum: [telemt, panel] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [version], properties: { version: { type: string } } }
      responses:
        "202": { description: Run started (progress via SSE topic `update`) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: update_locked — another update run holds the global lock, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/updates/auto:
    get:
      tags: [updates]
      operationId: getAutoUpdate
      responses:
        "200": { description: Settings, content: { application/json: { schema: { $ref: "#/components/schemas/AutoUpdateSettings" } } } }
    put:
      tags: [updates]
      operationId: putAutoUpdate
      description: Persisted to the store — the panel never rewrites its config file.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AutoUpdateSettings" } } }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ───────────────────────── realtime ─────────────────────────
  /api/events:
    get:
      tags: [realtime]
      operationId: streamEvents
      description: >
        SSE stream. Events: one per subscribed topic (users|stats|runtime|upstreams|security|web|update)
        carrying full topic snapshots, plus `event: heartbeat` (data `{}`, every ~25s of
        quiet) and source_error. Supports Last-Event-ID. Protocol: 02-hub-sse.md.
      parameters:
        - { name: topics, in: query, required: true, schema: { type: string }, example: "users,stats,runtime" }
      responses:
        "200": { description: Event stream, content: { text/event-stream: { schema: { type: string } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/events/logs:
    get:
      tags: [realtime]
      operationId: streamLogs
      description: >
        SSE stream of LogLine events (`event: log`), plus the same `event: heartbeat`
        frame as /api/events during quiet periods.
      parameters:
        - { name: service, in: query, required: true, schema: { type: string, enum: [telemt, panel] } }
      responses:
        "200": { description: SSE of LogLine events, content: { text/event-stream: { schema: { type: string } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "501": { description: log_stream_unavailable — host cap log_stream=false, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: log_source_error — the log source failed to start streaming, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/snapshot:
    get:
      tags: [realtime]
      operationId: getSnapshot
      description: >
        One-shot topic snapshots (initial render / no-SSE fallback). Same payloads as SSE
        events. A topic whose on-demand fetch fails is omitted from the response object
        entirely — never a bare JSON null — so every key present is a real snapshot.
      parameters:
        - { name: topics, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Map topic → snapshot; a topic with no data yet is simply absent as a key
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { description: telemt_unreachable — every requested topic's fetch failed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/history:
    get:
      tags: [realtime]
      operationId: getHistory
      description: >
        Metric history from the store's in-memory RAM ring (ruling R3: memory-profile
        store keeps ~15 minutes of raw points per metric, recorded by the hub after each
        "stats" topic poll). Never errors on empty/partial history — a metric with
        nothing recorded yet (or a `range` longer than what's retained) is 200 with
        however many points actually exist, even zero.
      parameters:
        - { name: metric, in: query, required: true, schema: { type: string, enum: [connections, traffic, health, active_users, refusals, attempts] } }
        - { name: range, in: query, required: true, schema: { type: string, enum: [15m, 1h, 24h, 7d] } }
      responses:
        "200": { description: Series (possibly empty), content: { application/json: { schema: { $ref: "#/components/schemas/HistorySeries" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ───────────────────────── misc ─────────────────────────
  /api/health:
    get:
      tags: [misc]
      security: []
      operationId: getHealth
      description: Unauthenticated liveness probe; no Telemt or store dependency.
      responses:
        "200":
          description: Panel is up
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string }

  /api/logs/tail:
    get:
      tags: [misc]
      operationId: tailLogs
      parameters:
        - { name: service, in: query, required: true, schema: { type: string, enum: [telemt, panel] } }
        - { name: lines, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        "200":
          description: Recent lines
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/LogLine" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "501": { description: log_tail_unavailable — host cap log_tail=false, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: log_source_error — the log source failed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/audit:
    get:
      tags: [misc]
      operationId: getAudit
      description: >
        Panel operation journal (logins, user changes, config patches, updates), newest
        first, read from the store's audit ring (at most 500 entries retained).
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
        - name: before
          in: query
          description: >
            Cursor for paging further back: an entry's own `ts` value from a previous
            response (RFC3339Nano — the exact format encoding/json produces for a Go
            time.Time). Returns entries strictly older than this timestamp. There is no
            separate opaque cursor token; `ts` doubles as one.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Entries newest-first (possibly empty)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/geoip:
    x-status: planned
    get:
      tags: [misc]
      operationId: lookupGeo
      parameters:
        - { name: ip, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Geo info, content: { application/json: { schema: { $ref: "#/components/schemas/GeoInfo" } } } }
        "501": { description: GeoIP databases not configured }

  # ───────────────────────── subpage ─────────────────────────
  /sub/{token}:
    get:
      tags: [subpage]
      security: []
      operationId: getSubscriptionPage
      description: >
        Unauthenticated per-user subscription page (04-subpage.md). Server-rendered HTML,
        no required JS; uniform 404 for unknown tokens; rate limited per IP.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Page, content: { text/html: { schema: { type: string } } } }
        "404": { description: Unknown token (uniform, no details) }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: panel_session

  parameters:
    Username:
      name: username
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_.-]{1,64}$" }

  responses:
    Unauthorized:
      description: No valid session
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: Invalid input
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Too many requests
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TelemtUnreachable:
      description: telemt_unreachable | telemt_auth_failed
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TelemtReadOnly:
      description: Telemt API is in read_only mode
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - bad_request
            - invalid_credentials
            - rate_limited
            - session_expired
            - csrf_rejected
            - internal_error
            - not_found
            - telemt_unreachable
            - capability_absent
            - capability_unavailable
            - manual_restart_required
            - update_locked
            - sublink_unavailable
            - log_tail_unavailable
            - log_stream_unavailable
            - log_source_error
            - totp_required
            - telemt_auth_failed
            - user_exists
            - last_user_forbidden
            - read_only
            - revision_conflict
            - reload_in_progress
            - reload_not_found
            - ambiguous_listeners
            - access_not_editable
            - section_not_editable
            - field_not_editable
            - unauthorized
            - forbidden
            - method_not_allowed
            - config_patch_not_atomic
            - payload_too_large
            - api_disabled
            - maestro_unavailable
            - unsupported_media_type
            - web_runtime_unavailable
            - web_snapshot_busy
            - web_runtime_mismatch
            - web_issuance_enabled
            - web_operation_in_progress
            - web_session_not_found
            - web_operation_not_found
          description: >
            Machine code. Panel codes actually emitted today (grepped from every
            WriteError call site): bad_request, invalid_credentials, rate_limited,
            session_expired, csrf_rejected, internal_error, not_found,
            telemt_unreachable, capability_absent, capability_unavailable,
            manual_restart_required, update_locked, sublink_unavailable,
            log_tail_unavailable, log_stream_unavailable, log_source_error.
            capability_absent (501) vs capability_unavailable (503) are
            deliberately distinct, not aliases: capability_absent means the
            route itself doesn't exist on this Telemt build (a bare 404/405
            with no error envelope — detected reactively, after attempting
            the call: rotate-secret, enable/disable, POST /api/telemt/reload,
            GET /api/telemt/reload/{id}); capability_unavailable means the
            route exists but the feature behind it is switched off on this
            Telemt — either known up front from the SDK's cached Capabilities
            probe (GET/PATCH /api/telemt/config, config_api) or reported by
            the response itself (GET /api/telemt/tls-fingerprints, whose
            enabled:false means runtime_edge_enabled is off; read from the
            response rather than probed so an unreachable Telemt still maps
            to 502 telemt_unreachable).
            Reserved for milestones not yet implemented: totp_required (TOTP login),
            telemt_auth_failed (superseded on /api/telemt/info by a reachable:false
            body, not an error status — kept here for /api/telemt/config, M3).
            A well-formed Telemt *APIError whose status is 4xx and isn't otherwise
            mapped above is passed through verbatim with Telemt's own code — notably
            user_exists, last_user_forbidden, read_only, revision_conflict,
            reload_in_progress, reload_not_found, ambiguous_listeners (the latter two
            absent from Telemt's own documented error-code table but confirmed against
            its source, M3), plus any other code in Telemt's own set (07-telemt-sdk.md):
            bad_request, access_not_editable, section_not_editable, field_not_editable,
            unauthorized, forbidden, method_not_allowed, config_patch_not_atomic,
            payload_too_large, api_disabled, maestro_unavailable — except
            access_not_editable/section_not_editable/field_not_editable/
            config_patch_not_atomic/ambiguous_listeners on PATCH /api/telemt/config,
            which the panel remaps to HTTP 422 regardless of Telemt's own status.
            The WEB group (Telemt >= 3.5.3, internal/telemt/types_web.go) adds
            web_runtime_mismatch, web_issuance_enabled, web_operation_in_progress,
            web_snapshot_busy, web_session_not_found, web_operation_not_found and
            unsupported_media_type; web_runtime_unavailable is listed because it is
            Telemt's own code, but the panel remaps it to capability_unavailable
            (rule R5) so the closed-capability gate is drawn instead of an error.
            Every code in this enum must carry a message in BOTH dictionaries —
            web/src/i18n/i18n.test.ts walks this list.
        message: { type: string }

    User:
      type: object
      description: Telemt UserInfo merged with quota usage and panel extras.
      required: [username, enabled, current_connections, active_unique_ips, total_octets, links]
      properties:
        username: { type: string }
        enabled: { type: boolean }
        in_runtime: { type: boolean }
        user_ad_tag: { type: string }
        max_tcp_conns: { type: integer }
        max_unique_ips: { type: integer }
        data_quota_bytes: { type: integer, format: int64 }
        expiration_rfc3339: { type: string, format: date-time }
        rate_limit_up_bps: { type: integer, format: int64 }
        rate_limit_down_bps: { type: integer, format: int64 }
        current_connections: { type: integer, format: int64 }
        active_unique_ips: { type: integer }
        active_unique_ips_list: { type: array, items: { type: string } }
        recent_unique_ips: { type: integer }
        recent_unique_ips_list: { type: array, items: { type: string } }
        total_octets: { type: integer, format: int64 }
        links: { $ref: "#/components/schemas/UserLinks" }
        quota:
          type: object
          description: Present when the quota capability is available and the user has a quota.
          required: [used_bytes, last_reset_epoch_secs]
          properties:
            used_bytes: { type: integer, format: int64 }
            last_reset_epoch_secs: { type: integer, format: int64 }
        sub_url: { type: string, description: Absolute subscription page URL }

    UserLinks:
      type: object
      required: [classic, secure, tls, tls_domains]
      properties:
        classic: { type: array, items: { type: string } }
        secure: { type: array, items: { type: string } }
        tls: { type: array, items: { type: string } }
        tls_domains:
          type: array
          items:
            type: object
            required: [domain, link]
            properties:
              domain: { type: string }
              link: { type: string }

    UserCreate:
      type: object
      required: [username]
      properties:
        username: { type: string, pattern: "^[A-Za-z0-9_.-]{1,64}$" }
        secret: { type: string, pattern: "^[0-9a-fA-F]{32}$" }
        user_ad_tag: { type: string, pattern: "^[0-9a-fA-F]{32}$" }
        max_tcp_conns: { type: integer, minimum: 1 }
        max_unique_ips: { type: integer, minimum: 1 }
        data_quota_bytes: { type: integer, format: int64, minimum: 1 }
        expiration_rfc3339: { type: string, format: date-time }
        rate_limit_up_bps: { type: integer, format: int64, minimum: 1 }
        rate_limit_down_bps: { type: integer, format: int64, minimum: 1 }
        enabled: { type: boolean, default: true }

    UserPatch:
      type: object
      description: JSON Merge Patch — null removes a limit, omitted leaves unchanged.
      properties:
        secret: { type: string, pattern: "^[0-9a-fA-F]{32}$" }
        user_ad_tag: { type: [string, "null"] }
        max_tcp_conns: { type: [integer, "null"] }
        max_unique_ips: { type: [integer, "null"] }
        data_quota_bytes: { type: [integer, "null"], format: int64 }
        expiration_rfc3339: { type: [string, "null"] }
        rate_limit_up_bps: { type: [integer, "null"], format: int64 }
        rate_limit_down_bps: { type: [integer, "null"], format: int64 }
        enabled: { type: [boolean, "null"] }

    Sublink:
      type: object
      required: [url, enabled]
      properties:
        url: { type: string }
        enabled: { type: boolean, description: false when subpage module is disabled }

    TelemtInfo:
      type: object
      required: [reachable, capabilities]
      properties:
        reachable: { type: boolean }
        version: { type: string }
        arch: { type: string }
        os: { type: string }
        uptime_seconds: { type: number }
        config_path: { type: string }
        config_edit_mode: { type: string, enum: [api, file] }
        capabilities:
          type: object
          description: Detected per 07-telemt-sdk.md §SDK-3.
          required: [quota, runtime_edge, reload_api, config_api, user_enable_disable, rotate_secret]
          properties:
            quota: { type: boolean }
            runtime_edge: { type: boolean }
            reload_api: { type: boolean }
            config_api: { type: boolean }
            user_enable_disable: { type: boolean }
            rotate_secret: { type: boolean }
        hint:
          type: string
          description: Actionable diagnostic (e.g. "check [server.api].whitelist — connection dropped").

    ZeroAllData:
      type: object
      description: >
        GET /v1/stats/zero/all's deep counter dump, passed through as-is. Only the top
        level (five named sections) is typed — each section's leaves are a display-only
        object mixing u64 counters with bools/strings/nested arrays (07-telemt-sdk.md),
        never branched on by the panel.
      required: [generated_at_epoch_secs, core, upstream, middle_proxy, pool, desync]
      properties:
        generated_at_epoch_secs: { type: integer }
        core: { type: object, additionalProperties: true }
        upstream: { type: object, additionalProperties: true }
        middle_proxy: { type: object, additionalProperties: true }
        pool: { type: object, additionalProperties: true }
        desync: { type: object, additionalProperties: true }

    TlsFingerprintRow:
      type: object
      description: >
        One aggregated JA3/JA4 row. `scope` is present only in the by_ip/by_cidr/by_user
        lists (the grouping key), absent in by_fingerprint — TELEMT_LIVE_API_DATA.md §19.
      required: [ja3, ja3_raw, ja4, ja4_raw, total, auth_success, bad_or_probe, first_seen_epoch_secs, last_seen_epoch_secs]
      properties:
        scope: { type: string }
        ja3: { type: string }
        ja3_raw: { type: string }
        ja4: { type: string }
        ja4_raw: { type: string }
        total: { type: integer }
        auth_success: { type: integer }
        bad_or_probe: { type: integer }
        first_seen_epoch_secs: { type: integer }
        last_seen_epoch_secs: { type: integer }

    TlsFingerprints:
      type: object
      required: [limit, retention_secs, capacity, dropped_total, parse_error_total, by_fingerprint, by_ip, by_cidr, by_user]
      properties:
        limit: { type: integer }
        retention_secs: { type: integer }
        capacity: { type: integer }
        dropped_total: { type: integer }
        parse_error_total: { type: integer }
        by_fingerprint: { type: array, items: { $ref: "#/components/schemas/TlsFingerprintRow" } }
        by_ip: { type: array, items: { $ref: "#/components/schemas/TlsFingerprintRow" } }
        by_cidr: { type: array, items: { $ref: "#/components/schemas/TlsFingerprintRow" } }
        by_user: { type: array, items: { $ref: "#/components/schemas/TlsFingerprintRow" } }

    GatedTlsFingerprints:
      type: object
      description: >
        Telemt's Gated[T] wrapper, passed through as-is: `data` is omitted when the
        source is off or unavailable, and `reason` says why (07-telemt-sdk.md).
      required: [enabled, generated_at_epoch_secs]
      properties:
        enabled: { type: boolean }
        reason: { type: string }
        generated_at_epoch_secs: { type: integer }
        data: { $ref: "#/components/schemas/TlsFingerprints" }

    WebSessionRow:
      type: object
      description: >
        One live WEB session. `session_ref` plus the optional user-agent pair sit at the
        same level as the 23 WebSessionStatus fields — Telemt flattens the status struct
        into the row (`#[serde(flatten)]`, src/web/session/status.rs).
      required: [session_ref, trace_session_id, client_ip, host, user, key_id, carrier, attempt, client_class, automatic, state, streams, tasks, lanes, lane_open_waits, websocket_lane_reservations, websocket_active, pending_bytes, pending_items, control_bytes, control_items, age_ms, idle_ms]
      properties:
        session_ref: { type: string }
        user_agent: { type: string }
        user_agent_id: { type: string }
        trace_session_id: { type: integer }
        client_ip: { type: string }
        host: { type: string }
        user: { type: string }
        key_id: { type: string }
        carrier: { type: string, enum: [https, https-lanes, websocket, websocket-lanes] }
        attempt: { type: integer }
        client_class: { type: string }
        automatic: { type: boolean }
        state: { type: string }
        streams: { type: integer }
        tasks: { type: integer }
        lanes: { type: integer }
        lane_open_waits: { type: integer }
        websocket_lane_reservations: { type: integer }
        websocket_active: { type: boolean }
        pending_bytes: { type: integer }
        pending_items: { type: integer }
        control_bytes: { type: integer }
        control_items: { type: integer }
        age_ms: { type: integer }
        idle_ms: { type: integer }
        negotiation_remaining_ms: { type: integer }

    WebSessionPage:
      type: object
      description: >
        One page of the ordered scan. There is no total: the scan is bounded (Telemt caps it
        at 1000 candidates, reporting `scan_truncated`) and paging is by opaque cursor.
        `partial` is `["manager"]` when the manager lock was contended — an empty page that
        means "busy", not "no sessions".
      required: [sessions, next_cursor, scanned, scan_truncated, partial_sessions, partial]
      properties:
        sessions: { type: array, items: { $ref: "#/components/schemas/WebSessionRow" } }
        next_cursor: { type: [string, "null"] }
        scanned: { type: integer }
        scan_truncated: { type: boolean }
        partial_sessions: { type: integer }
        partial: { type: array, items: { type: string } }

    WebSessionClosed:
      type: object
      description: The retained tombstone of a session that has already closed.
      required: [session_ref, state, attempt]
      properties:
        session_ref: { type: string }
        state: { type: string }
        attempt: { type: integer }

    WebSessionLookup:
      type: object
      description: >
        Exactly one of the two is present: `row` for a live session, `closed` for a
        tombstone.
      properties:
        row: { $ref: "#/components/schemas/WebSessionRow" }
        closed: { $ref: "#/components/schemas/WebSessionClosed" }

    WebCloseSelector:
      type: object
      description: >
        Internally tagged by `kind`. `refs` carries 1..200 canonical refs; `filter` needs at
        least one of the filter fields; `all` is the whole registry and is refused while WEB
        issuance is still enabled.
      required: [kind]
      properties:
        kind: { type: string, enum: [refs, filter, all] }
        session_refs: { type: array, items: { type: string } }
        session_ref: { type: string }
        ip: { type: string }
        host: { type: string }
        user: { type: string }
        user_agent_id: { type: string }
        key_id: { type: string }
        carrier: { type: string, enum: [https, https-lanes, websocket, websocket-lanes] }
        state: { type: string }

    WebCloseRequest:
      type: object
      required: [runtime_instance, selector]
      properties:
        runtime_instance:
          type: string
          description: >
            The process fence, read from the `web` topic's status snapshot. A Telemt that
            has restarted since answers 409 web_runtime_mismatch instead of closing whatever
            now holds those ids.
        selector: { $ref: "#/components/schemas/WebCloseSelector" }

    WebControlOperationStatus:
      type: object
      description: >
        The 202 body of a close and the 200 body of its poll — the same shape. `requested`
        is the explicit ref count for a `refs` selector and 0 for `filter`/`all`, which have
        no up-front size.
      required: [operation_id, state, high_water_session_ref, requested, scanned, matched, close_signalled, conflicted, created_epoch_millis, updated_epoch_millis]
      properties:
        operation_id: { type: string }
        state: { type: string, enum: [queued, running, completed, cancelled, failed] }
        high_water_session_ref: { type: [string, "null"] }
        requested: { type: integer }
        scanned: { type: integer }
        matched: { type: integer }
        close_signalled: { type: integer }
        conflicted: { type: integer }
        created_epoch_millis: { type: integer, format: int64 }
        updated_epoch_millis: { type: integer, format: int64 }
        failure: { type: string }

    TelemtConfig:
      type: object
      description: >
        api mode only in this release (file mode / telemt.config_edit_mode=file is not
        implemented yet — see GET /api/telemt/config's description).
      required: [revision, sections]
      properties:
        revision: { type: string }
        sections:
          type: object
          additionalProperties: { type: [object, "null"], additionalProperties: true }
          description: >
            Map of section name → that section's JSON, straight from Telemt (integers
            preserved). Open-ended: a section a newer Telemt adds (`web`, since 3.5.3)
            passes through unchanged rather than being dropped, and a section value the
            panel received as null is passed on as null rather than synthesized into {}.

    TelemtConfigPatch:
      type: object
      description: >
        The revision travels as the request's `If-Match` header (required), not a body
        field here — see PATCH /api/telemt/config's description.
      required: [sections]
      properties:
        sections:
          type: object
          additionalProperties: true
          description: Sparse map of section name → JSON Merge Patch value for that section.

    TelemtConfigPatchResult:
      type: object
      description: Telemt's PATCH /v1/config response, passed through as-is.
      required: [revision, changed]
      properties:
        revision: { type: string }
        changed: { type: array, items: { type: string } }
        restart_required: { type: boolean, description: Legacy field, still sent by current Telemt builds. }
        runtime_reload_required: { type: boolean }
        process_restart_required: { type: boolean }
        deferred_process_fields: { type: array, items: { type: string } }
        reload:
          description: Present only when the request's `reload` query parameter triggered an inline reload.
          allOf: [{ $ref: "#/components/schemas/ReloadAccepted" }]

    ReloadAccepted:
      type: object
      description: The 202 payload of Telemt's POST /v1/system/reload, passed through as-is.
      required: [reload_id, target_generation, config_revision, state, mode, failure_policy]
      properties:
        reload_id: { type: integer, format: int64 }
        target_generation: { type: integer, format: int64 }
        config_revision: { type: string }
        state: { type: string, enum: [accepted, preparing, activating, draining, succeeded, rolled_back, failed] }
        mode: { type: string, enum: [instant, drain] }
        failure_policy: { type: string, enum: [keep_new, rollback] }

    ReloadStatus:
      type: object
      description: Telemt's GET /v1/system/reload/{id} response, passed through as-is.
      required: [reload_id, target_generation, config_revision, state, mode, failure_policy, requested_at_epoch_secs]
      properties:
        reload_id: { type: integer, format: int64 }
        target_generation: { type: integer, format: int64 }
        config_revision: { type: string }
        state: { type: string, enum: [accepted, preparing, activating, draining, succeeded, rolled_back, failed] }
        mode: { type: string, enum: [instant, drain] }
        failure_policy: { type: string, enum: [keep_new, rollback] }
        requested_at_epoch_secs: { type: integer, format: int64 }
        started_at_epoch_secs: { type: integer, format: int64 }
        finished_at_epoch_secs: { type: integer, format: int64 }
        deferred_process_fields: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        error: { type: string }

    HostInfo:
      type: object
      required: [service_manager, log_source, privileges_mode, caps]
      properties:
        service_manager: { type: string, enum: [systemd, openrc, procd, sysvinit, docker, none] }
        log_source: { type: string, enum: [journald, logread, syslog, docker, file, none] }
        privileges_mode: { type: string, enum: [agent, direct, degraded] }
        os_release: { type: string }
        caps:
          type: object
          required: [restart_telemt, restart_panel, log_tail, log_stream, self_update]
          properties:
            restart_telemt: { type: boolean }
            restart_panel: { type: boolean }
            log_tail: { type: boolean }
            log_stream: { type: boolean }
            self_update: { type: boolean }
        manual_commands:
          type: object
          additionalProperties: { type: string }
          description: Copyable shell commands for operations with cap=false.

    UpdatesStatus:
      type: object
      required: [targets, lock_held]
      properties:
        lock_held: { type: boolean }
        targets:
          type: array
          items:
            type: object
            required: [target, current_version, releases]
            properties:
              target: { type: string, enum: [telemt, panel] }
              current_version: { type: string }
              releases:
                type: array
                items:
                  type: object
                  required: [version, published_at]
                  properties:
                    version: { type: string }
                    published_at: { type: string, format: date-time }
                    prerelease: { type: boolean }
                    newer: { type: boolean }
              active_run: { $ref: "#/components/schemas/UpdateRun" }
              journal: { type: array, items: { $ref: "#/components/schemas/UpdateRun" } }

    UpdateRun:
      type: object
      required: [run_id, target, phase, version_to, started_at]
      properties:
        run_id: { type: string }
        target: { type: string, enum: [telemt, panel] }
        phase:
          type: string
          enum: [checking, downloading, verifying, staging, installing, restarting, health, done, rolling_back, rolled_back, failed]
        version_from: { type: string }
        version_to: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        detail: { type: string }

    AutoUpdateSettings:
      type: object
      required: [telemt, panel, interval]
      properties:
        telemt: { type: string, enum: [off, check, apply] }
        panel: { type: string, enum: [off, check, apply] }
        interval: { type: string, description: Go duration ≥ 1h, e.g. "6h" }

    SessionInfo:
      type: object
      required: [id, created, last_seen, current]
      properties:
        id: { type: string }
        created: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        ip: { type: string }
        user_agent_label: { type: string, description: Parsed, human-readable ("iPhone · Safari") }
        auth_method: { type: string, enum: [password, passkey] }
        current: { type: boolean }

    PasskeyInfo:
      type: object
      required: [id, name, created]
      properties:
        id: { type: string }
        name: { type: string }
        created: { type: string, format: date-time }
        last_used: { type: string, format: date-time }

    LogLine:
      type: object
      required: [ts, msg]
      properties:
        ts: { type: string, format: date-time }
        level: { type: string, enum: [debug, info, warn, error, unknown] }
        unit: { type: string }
        msg: { type: string }

    AuditEntry:
      type: object
      required: [ts, action]
      properties:
        ts: { type: string, format: date-time }
        action: { type: string, description: "login | user.create | user.patch | user.delete | quota.reset | config.patch | update.apply | ..." }
        subject: { type: string, description: Username / target / section }
        detail: { type: string }

    HistorySeries:
      type: object
      required: [metric, range, points]
      properties:
        metric: { type: string }
        range: { type: string }
        points:
          type: array
          items:
            type: object
            required: [ts, v]
            properties:
              ts: { type: integer, format: int64, description: epoch seconds }
              v: { type: number }

    GeoInfo:
      type: object
      required: [ip]
      properties:
        ip: { type: string }
        country: { type: string }
        city: { type: string }
        asn: { type: integer }
        as_org: { type: string }
