services:
  telemt-panel:
    # RC3: TELEMT_PANEL_IMAGE=ghcr.io/amirotin/telemt_panel:1.0.0-rc.3
    image: "${TELEMT_PANEL_IMAGE:?Set TELEMT_PANEL_IMAGE to the tested nonroot release image}"
    restart: unless-stopped
    user: "65532:65532"
    # Linux: access Telemt's loopback API without exposing it to the network.
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - type: bind
        source: ./config
        target: /etc/telemt-panel
        bind:
          create_host_path: false
      - panel-data:/var/lib/telemt-panel

volumes:
  panel-data:
